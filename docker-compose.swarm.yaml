services:
  postgres:
    image: pgvector/pgvector:pg16
    deploy:
      restart_policy:
        condition: none
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in looloo-api/.env}
      POSTGRES_DB: ${DB_NAME:-looloo}
    ports: ["5432:5432"]
    volumes:
      - /docker/database/postgres:/var/lib/postgresql/data
    networks: [looloo-network]

  api:
    image: rajasekar9698/looloo-api:2.0.0
    deploy:
      restart_policy:
        condition: none
    env_file: .env
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL: "false"
    ports: ["3000:3000"]
    networks: [looloo-network]

networks:
  looloo-network:
    external: true
